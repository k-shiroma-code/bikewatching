<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <!-- Mapbox GL JS CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="map.css" />

    <script src="map.js" type="module"></script>
  </head>
  <body>
    <header>
      <div>
        <h1>🚴🏼‍♀️ Bikewatching</h1>
        <p class="subtitle">
          Bluebikes traffic in Boston &amp; Cambridge, March 2024. Circle size = trips at a station;
          color = whether more riders leave or arrive.
        </p>
      </div>

      <!-- Step 5.1: time filter -->
      <label class="time-filter">
        Filter by time:
        <input id="time-slider" type="range" min="-1" max="1440" value="-1" />
        <time id="selected-time"></time>
        <em id="any-time">(any time)</em>
      </label>
    </header>

    <div id="map">
      <svg></svg>
      <p id="status" class="status">Loading 260,000 trips…</p>
    </div>

    <!-- Step 6.2: legend (Design 2: separate swatches & labels) -->
    <div class="legend">
      <span class="legend-label">Legend:</span>
      <div style="--departure-ratio: 1">More departures</div>
      <div style="--departure-ratio: 0.5">Balanced</div>
      <div style="--departure-ratio: 0">More arrivals</div>
    </div>
  </body>
</html>
